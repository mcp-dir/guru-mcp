# Smithery configuration for Digital Manager Guru
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_guru

name: guru-mcp
displayName: "Digital Manager Guru"
description: >
  Plataforma de checkout e gestão de vendas de infoprodutos Digital Manager Guru via API oficial: vendas/transações, assinaturas, produtos e ofertas, contatos, afiliações, cupons, ingressos (e-tickets) e webhooks. Gere seu User Token no painel em Meu Perfil → Tokens API.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/guru-mcp
repository: https://github.com/mcp-dir/guru-mcp

tags:
  - guru
  - brazil
  - creator
  - horizontal
  - read-write

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_guru

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_guru/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
